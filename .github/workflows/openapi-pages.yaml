name: Publish OpenAPI docs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Base URL for "Try it out" (overrides OPENAPI_API_URL)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: openapi-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate the spec
        run: node scripts/openapi/generate.mjs

      - name: Build the static docs site
        run: node scripts/openapi/preview.mjs --static _openapi
        env:
          OPENAPI_API_URL: ${{ inputs.api_url || vars.OPENAPI_API_URL || '' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _openapi

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4