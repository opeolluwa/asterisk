[package]
name = "asterisk_generator"
version.workspace = true
edition = "2024"

[lib]
name = "asterisk_generator"
path = "src/lib.rs"

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
convert_case = "0.8"
dialoguer = "0.11"
thiserror = "2.0.18"
