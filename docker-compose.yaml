  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "7379:6379"
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  redisinsight:
    image: redis/redisinsight:3.8
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
    volumes:
      - redisinsight-data:/data
    networks:
      - internal
    ports:
      - 5540:5540

  maildev:
    image: maildev/maildev
    container_name: maildev
    ports:
      - "1080:1080"   # WEB UI
      - "1025:1025"  #SMTP port 
    environment:
      - MAILDEV_OUTGOING_HOST=localhost
      - MAILDEV_OUTGOING_PORT=3400
      - MAILDEV_OUTGOING_USER=asterisk
      - MAILDEV_OUTGOING_PASS=asterisk

    networks:
      - internal

volumes:
  cargo-target:
  rust-cache:
  postgres-data:
  pgadmin-data:
  redis-data:
  redisinsight-data:

networks:
  internal:
    name: internal
    driver: bridge