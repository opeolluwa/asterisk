[package]
name = "asterisk_migration"
version.workspace = true
edition = "2024"
publish = false

[lib]
name = "asterisk_migration"
path = "src/lib.rs"

[dependencies]
sea-orm = { version = "2.0.2" }
sea-orm-migration = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
tokio = { version = "1.44.2", features = ["full", "macros"] }
ulid = "1.2.1"
